name: Refresh Femgram media catalogue

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-femgram-catalogue
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Refresh Bluesky catalogue
        run: node scripts/fetch-bluesky.mjs

      - name: Refresh Openverse catalogue
        run: node scripts/fetch-openverse.mjs
        continue-on-error: true

      - name: Refresh Wikimedia Commons catalogue
        run: node scripts/fetch-wikimedia.mjs
        continue-on-error: true

      - name: Refresh Reddit catalogue
        run: node scripts/fetch-reddit.mjs
        continue-on-error: true

      - name: Refresh Newgrounds catalogue
        run: node scripts/fetch-newgrounds.mjs
        continue-on-error: true

      - name: Refresh DeviantArt catalogue
        run: node scripts/fetch-deviantart.mjs
        continue-on-error: true

      - name: Refresh Mastodon catalogue
        run: node scripts/fetch-mastodon.mjs
        continue-on-error: true

      - name: Refresh Tumblr catalogue
        run: node scripts/fetch-tumblr.mjs
        continue-on-error: true

      - name: Refresh Flickr catalogue
        run: node scripts/fetch-flickr.mjs
        continue-on-error: true

      - name: Commit catalogue when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/media.json
          if git diff --cached --quiet; then
            echo "No catalogue changes."
            exit 0
          fi
          git commit -m "Refresh Femgram media catalogue"
          git push
