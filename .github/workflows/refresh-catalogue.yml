name: Refresh Femgram media catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-femgram-catalogue
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Refresh live catalogue
        run: node scripts/fetch-bluesky.mjs

      - name: Commit catalogue when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/media.json
          if git diff --cached --quiet; then
            echo "No catalogue changes."
            exit 0
          fi
          git commit -m "Refresh Femgram media catalogue"
          git push
